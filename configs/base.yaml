# ==================== 基础配置 ====================
seed: 64                          # 随机种子，保证实验可复现
device: cuda                        # 计算设备
mixed_precision: bf16               # 混合精度模式（bf16/fp16/no）

# ==================== 训练配置 ====================
training:
  stage1_epochs: 1                  # Stage 1 持续的 epoch 数（仅重构预训练）
  total_epochs: 10                  # 总 epoch 数
  cls_warmup_ratio: 0.5             # Stage 2 首个 epoch 的分类预热比例（0=跳过）

  optimizer:
    lr: 5e-4                        # 学习率
    weight_decay: 1e-5              # 权重衰减
  scheduler:
    type: cosine_with_warmup        # 学习率调度器（硬编码 1 epoch warmup + cosine annealing）
    eta_min: 1e-6                   # 余弦退火最小学习率
  early_stopping:
    patience: 4                     # 早停耐心值

# ==================== 损失配置 ====================
loss:
  alpha_recon: 0.05                 # 重构损失缩放系数，降低重构量级避免淹没分类梯度
  cl_weight: 0.1                    # 对比学习损失权重
  balance_weight: 0.01              # MoE 专家负载均衡损失权重
  focal_gamma: 2.0                  # Focal Loss gamma，增大对难样本的关注
  w_anomaly: 1.2                    # 异常点分类权重
  w_normal: 0.8                     # 正常点分类权重

# ==================== 数据配置 ====================
data:
  batch_size: 32                    # 批大小
  mask_ratio: 0.3                   # 自监督掩码比例
  max_seq_length: 5000              # 最大序列长度
  effective_batch_size: 256         # 有效批大小（gradient_accumulation_steps = effective_batch_size // batch_size）
  num_workers: 4                    # DataLoader 工作线程数
  val_ratio: 0.1                    # 验证集比例
  val_mode: split                   # 验证模式（tsb/split）
  min_seq_length: 100               # 最短序列长度过滤阈值
  dynamic_batch: false              # 动态批大小（短样本自动增大 batch）
  max_batch_size: 64                # 动态批最大值（dynamic_batch=true 时生效）
  padding_ratio: 1.5                # 动态批 padding 比例（用于 ViCO 图像渲染）
  shuffle_bucket: false             # 是否按长度分桶后 shuffle

  # ==================== 数据预处理配置 ====================
  data_setting:
    img_size: 224                   # 图像尺寸
    T_sqrt: false                   # 是否对时序值开方

# ==================== 模型配置 ====================
model:
  model_name: VETime-query-FGVA                # 模型名称
  vision_name: mae_visualize_base.pth  # 视觉编码器权重文件名
  ts_finetune_type: lora            # 时序编码器微调类型（lora/freeze）
  use_vectorized_fold: true         # 是否使用向量化 fold_image（约150倍加速）
  use_gradient_checkpointing: false  # 是否使用梯度检查点节省显存

  # ==================== 视觉双分支配置 ====================
  vision_branch:
    vico_renderer: vico              # 渲染器类型：vico / gaf / stft / ...
    renderer_params: {}              # 渲染器特定参数（预留扩展）

  # ==================== 解码器配置 ====================
  use_query_decoder: true          # 是否使用 Query-based 解码器（替代 MoE）
  # MoE 模式：需要二阶段课程训练（stage1 仅重构，stage2 联合训练）
  # Query Decoder 模式：单阶段训练，两任务从头同时进行

# ==================== 路径配置 ====================
paths:
  dataset_path: ./dataset/post_150000.pkl  # 训练数据集路径
  dataset_test_dir: ./dataset/TSB-AD/Datasets/TSB-AD-U         # 测试数据集目录
  file_list: ./dataset/TSB-AD/Datasets/File_List/TSB-AD-U.cs   # TSB 测试文件列表（null=自动扫描目录）
  ts_path: checkpoints/weight_ts/full_mask_anomaly_head_pretrain_checkpoint_best.pth  # TS Encoder 预训练权重
  vision_path: ./checkpoints/weight_v       # 视觉编码器权重目录
  vetime_path: null                         # VETime 完整权重路径（null=不加载）
  pretrain_from: null                       # 预训练权重路径（用于迁移学习，null=不加载）
  resume: null                              # 恢复训练的 checkpoint 路径（null=不恢复）
  save_dir: ./output                        # 输出目录
  output_file_path: ./output/result.json    # 评估结果输出文件
